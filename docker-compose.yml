version: '3.8'

services:
  postgres:
    image: ankane/pgvector:pg16
    container_name: mecania-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mecania
      POSTGRES_USER: mecania
      POSTGRES_PASSWORD: mecania
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mecania -d mecania"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: