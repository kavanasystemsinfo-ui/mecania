services:
  postgres:
    # Fijada a PG 15 a propósito: el contenedor de preproducción ya corre 15.x y
    # la imagen 'latest' es una etiqueta móvil (dos arranques con meses de
    # diferencia pueden traer versiones distintas sin que nada lo avise). La
    # producción usa Neon PostgreSQL 16. Migrar este contenedor de desarrollo a
    # PG 16 es un paso aparte que pasa por recrearlo y volcar los datos.
    image: pgvector/pgvector:pg15
    container_name: mecania-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mecania
      POSTGRES_USER: mecania
      POSTGRES_PASSWORD: mecania
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mecania -d mecania"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: