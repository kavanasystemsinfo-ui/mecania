<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mecania - Registro de Vehículos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 4rem; }
        .sticky-top { z-index: 1020; }
        .document-row { cursor: pointer; }
        .document-row:hover { background-color: #f8f9fa; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Mecania</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#" id="refreshBtn">Actualizar lista</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h1 class="mb-4">Registro de Vehículos</h1>
    <div id="alertContainer"></div>
    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#vehicleModal">Crear Nuevo Vehículo</button>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Usuario ID</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Año</th>
                <th>Combustible</th>
                <th>Kilometraje</th>
                <th>Matrícula</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="vehicleTableBody">
        </tbody>
    </table>
</div>

<!-- Modal -->
<div class="modal fade" id="vehicleModal" tabindex="-1" aria-labelledby="vehicleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="vehicleModalLabel">Vehículo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Nav tabs -->
                <ul class="nav nav-tabs" id="vehicleTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="vehicle-tab" data-bs-toggle="tab" data-bs-target="#vehicle-tab-pane" type="button" role="tab" aria-controls="vehicle-tab-pane" aria-selected="true">Vehículo</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="document-tab" data-bs-toggle="tab" data-bs-target="#document-tab-pane" type="button" role="tab" aria-controls="document-tab-pane" aria-selected="false">Documentos</button>
                    </li>
                </ul>

                <!-- Tab panes -->
                <div class="tab-content">
                    <!-- Vehicle tab -->
                    <div class="tab-pane fade show active" id="vehicle-tab-pane" role="tabpanel" aria-labelledby="vehicle-tab">
                        <form id="vehicleForm">
                            <input type="hidden" id="vehicleId">
                            <div class="mb-3">
                                <label class="form-label">Usuario ID</label>
                                <input type="number" class="form-control" id="usuarioId" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Marca</label>
                                <input type="text" class="form-control" id="marca" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Modelo</label>
                                <input type="text" class="form-control" id="modelo" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Año</label>
                                <input type="number" class="form-control" id="anio" min="1900" max="2100" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Combustible</label>
                                <select class="form-select" id="combustible" required>
                                    <option value="">Seleccione...</option>
                                    <option value="GASOLINA">Gasolina</option>
                                    <option value="DIESEL">Diésel</option>
                                    <option value="HIBRIDO">Híbrido</option>
                                    <option value="ELECTRICO">Eléctrico</option>
                                    <option value="OTRO">Otro</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Kilometraje</label>
                                <input type="number" class="form-control" id="kilometraje" min="0" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Matrícula</label>
                                <input type="text" class="form-control" id="matricula" required>
                            </div>
                        </form>
                    </div>

                    <!-- Documents tab -->
                    <div class="tab-pane fade" id="document-tab-pane" role="tabpanel" aria-labelledby="document-tab">
                        <div id="documentAlertContainer"></div>
                        <div class="mb-3">
                            <label class="form-label">Subir documento para este vehículo</label>
                            <input class="form-control" type="file" id="documentFile" accept=".pdf,.txt,.docx">
                            <div class="form-text">Formatos permitidos: PDF, TXT, DOCX. Máximo 10 MB.</div>
                        </div>
                        <button class="btn btn-primary me-2" id="uploadDocumentBtn">Subir Documento</button>
                        <button class="btn btn-outline-secondary" id="refreshDocumentsBtn">Actualizar lista</button>
                        <hr>
                        <h6>Documentos subidos:</h6>
                        <div class="table-responsive">
                            <table class="table table-sm table-borderless" id="documentTable">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Nombre</th>
                                        <th>Tipo</th>
                                        <th>Tamaño</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="documentTableBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-primary" id="saveBtn">Guardar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
let apiBase = '/api/vehiculos';
let editMode = false;
let editingId = null;
let currentVehicleId = null; // Currently selected vehicle for document tab

function showAlert(message, type = 'info', containerId = 'alertContainer') {
    const container = document.getElementById(containerId);
    // Clear existing alerts
    container.innerHTML = '';
    const alert = document.createElement('div');
    alert.className = `alert alert-${type} alert-dismissible fade show`;
    alert.role = 'alert';
    alert.innerHTML = `
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    `;
    container.appendChild(alert);
    setTimeout(() => {
        alert.remove();
    }, 5000);
}

function showDocumentAlert(message, type = 'info') {
    showAlert(message, type, 'documentAlertContainer');
}

async function loadVehicles() {
    try {
        const resp = await fetch(apiBase);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const vehicles = await resp.json();
        const tbody = document.getElementById('vehicleTableBody');
        tbody.innerHTML = '';
        vehicles.forEach((v, idx) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${idx + 1}</td>
                <td>${v.usuarioId}</td>
                <td>${v.marca}</td>
                <td>${v.modelo}</td>
                <td>${v.anio}</td>
                <td>${v.combustible}</td>
                <td>${v.kilometraje}</td>
                <td>${v.matricula}</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="editVehicle(${v.id})">Editar</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteVehicle(${v.id})">Eliminar</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    } catch (err) {
        showAlert('Error al cargar vehículos: ' + err.message, 'danger');
        console.error(err);
    }
}

function clearForm() {
    document.getElementById('vehicleForm').reset();
    document.getElementById('vehicleId').value = '';
    editMode = false;
    editingId = null;
    const modalTitle = document.getElementById('vehicleModalLabel');
    modalTitle.textContent = 'Vehículo';
    document.getElementById('saveBtn').textContent = 'Guardar';
}

function loadDocumentsForVehicle(vehicleId) {
    currentVehicleId = vehicleId;
    // Update tab title
    document.getElementById('document-tab').textContent = `Documentos (vehículo ${vehicleId})`;
    // Load documents
    fetch(`${apiBase}/${vehicleId}/documentos`)
        .then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
        })
        .then(docs => {
            const tbody = document.getElementById('documentTableBody');
            tbody.innerHTML = '';
            docs.forEach((doc, idx) => {
                const tr = document.createElement('tr');
                tr.className = 'document-row';
                tr.onclick = () => previewDocument(doc.id, doc.nombre);
                tr.innerHTML = `
                    <td>${idx + 1}</td>
                    <td>${doc.nombre}</td>
                    <td>${doc.tipo}</td>
                    <td>${formatFileSize(doc.tamanoBytes)}</td>
                    <td><span class="badge bg-${getEstadoBadgeColor(doc.estado)}">${doc.estado}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="downloadDocument(${doc.id})">Descargar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        })
        .catch(err => {
            showDocumentAlert('Error al cargar documentos: ' + err.message, 'danger');
            console.error(err);
        });
}

function formatFileSize(bytes) {
    if (bytes === 0) return '0 Bytes';
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function getEstadoBadgeColor(estado) {
    switch (estado) {
        case 'LISTO': return 'success';
        case 'PROCESANDO': return 'warning';
        case 'ERROR': return 'danger';
        default: return 'secondary';
    }
}

async function previewDocument(documentoId, filename) {
    // For now, just try to download - in a real app we might preview PDFs in browser
    downloadDocument(documentoId);
}

async function downloadDocument(documentoId) {
    if (!currentVehicleId) {
        showDocumentAlert('Por favor seleccione un vehículo primero', 'warning');
        return;
    }
    try {
        const resp = await fetch(`${apiBase}/${currentVehicleId}/documentos/${documentoId}/download`);
        if (!resp.ok) {
            const errorData = await resp.json();
            throw new Error(errorData.message || `HTTP ${resp.status}`);
        }
        const blob = await resp.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename || 'documento';
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
    } catch (err) {
        showDocumentAlert('Error al descargar documento: ' + err.message, 'danger');
        console.error(err);
    }
}

async function uploadDocument() {
    if (!currentVehicleId) {
        showDocumentAlert('Por favor seleccione un vehículo primero', 'warning');
        return;
    }
    const fileInput = document.getElementById('documentFile');
    const file = fileInput.files[0];
    if (!file) {
        showDocumentAlert('Por favor seleccione un archivo para subir', 'warning');
        return;
    }
    // Validate file type
    const allowedTypes = ['application/pdf', 'text/plain', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
    if (!allowedTypes.includes(file.type)) {
        showDocumentAlert('Tipo de archivo no permitido. Use PDF, TXT o DOCX.', 'danger');
        return;
    }
    // Validate size (10MB)
    if (file.size > 10 * 1024 * 1024) {
        showDocumentAlert('El archivo es demasiado grande. Máximo 10 MB permitido.', 'danger');
        return;
    }

    const formData = new FormData();
    formData.append('file', file);

    try {
        const resp = await fetch(`${apiBase}/${currentVehicleId}/documentos`, {
            method: 'POST',
            body: formData
        });
        if (!resp.ok) {
            const errorData = await resp.json();
            throw new Error(errorData.message || `HTTP ${resp.status}`);
        }
        showDocumentAlert('Documento subido exitosamente', 'success');
        fileInput.value = ''; // Clear file input
        await loadDocumentsForVehicle(currentVehicleId); // Refresh list
    } catch (err) {
        showDocumentAlert('Error al subir documento: ' + err.message, 'danger');
        console.error(err);
    }
}

document.getElementById('vehicleForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const vehicle = {
        usuarioId: parseInt(document.getElementById('usuarioId').value),
        marca: document.getElementById('marca').value.trim(),
        modelo: document.getElementById('modelo').value.trim(),
        anio: parseInt(document.getElementById('anio').value),
        combustible: document.getElementById('combustible').value,
        kilometraje: parseInt(document.getElementById('kilometraje').value),
        matricula: document.getElementById('matricula').value.trim()
    };
    // Basic validation
    if (!vehicle.usuarioId || !vehicle.marca || !vehicle.modelo || !vehicle.anio || !vehicle.combustible || vehicle.kilometraje === null || !vehicle.matricula) {
        showAlert('Por favor complete todos los campos', 'warning');
        return;
    }
    try {
        let resp;
        if (editMode && editingId) {
            resp = await fetch(`${apiBase}/${editingId}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(vehicle)
            });
        } else {
            resp = await fetch(apiBase, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(vehicle)
            });
        }
        if (!resp.ok) {
            const errorData = await resp.json();
            throw new Error(errorData.message || `HTTP ${resp.status}`);
        }
        const newVehicle = await resp.json();
        showAlert('Vehículo guardado exitosamente', 'success');
        // Close modal
        const modalEl = document.getElementById('vehicleModal');
        const modal = bootstrap.Modal.getInstance(modalEl);
        modal.hide();
        clearForm();
        await loadVehicles();
    } catch (err) {
        showAlert('Error: ' + err.message, 'danger');
        console.error(err);
    }
});

function editVehicle(id) {
    editMode = true;
    editingId = id;
    fetch(`${apiBase}/${id}`)
        .then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
        })
        .then(v => {
            document.getElementById('vehicleId').value = v.id;
            document.getElementById('usuarioId').value = v.usuarioId;
            document.getElementById('marca').value = v.marca;
            document.getElementById('modelo').value = v.modelo;
            document.getElementById('anio').value = v.anio;
            document.getElementById('combustible').value = v.combustible;
            document.getElementById('kilometraje').value = v.kilometraje;
            document.getElementById('matricula').value = v.matricula;
            const modalTitle = document.getElementById('vehicleModalLabel');
            modalTitle.textContent = `Editar Vehículo #${v.id}`;
            document.getElementById('saveBtn').textContent = 'Actualizar';
            const modalEl = document.getElementById('vehicleModal');
            const modal = new bootstrap.Modal(modalEl);
            modal.show();
            // Load documents for this vehicle when editing
            loadDocumentsForVehicle(v.id);
            // Switch to documents tab
            const documentTabEl = document.getElementById('document-tab');
            const documentTab = new bootstrap.Tab(documentTabEl);
            documentTab.show();
        })
        .catch(err => {
            showAlert('Error al cargar vehículo: ' + err.message, 'danger');
            console.error(err);
        });
}

function deleteVehicle(id) {
    if (!confirm('¿Está seguro de eliminar este vehículo?')) return;
    fetch(`${apiBase}/${id}`, {method: 'DELETE'})
        .then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            showAlert('Vehículo eliminado exitosamente', 'success');
            return loadVehicles();
        })
        .catch(err => {
            showAlert('Error al eliminar vehículo: ' + err.message, 'danger');
            console.error(err);
        });
}

document.getElementById('refreshBtn').addEventListener('click', loadVehicles);
document.getElementById('refreshDocumentsBtn').addEventListener('click', () => {
    if (currentVehicleId) {
        loadDocumentsForVehicle(currentVehicleId);
    } else {
        showDocumentAlert('Por favor seleccione un vehículo primero', 'warning');
    }
});
document.getElementById('uploadDocumentBtn').addEventListener('click', uploadDocument);
document.getElementById('documentFile').addEventListener('change', function() {
    // Show filename next to button when file selected
    const fileName = this.value.split('\\').pop().split('/').pop();
    if (fileName) {
        this.nextElementSibling.textContent = `Archivo seleccionado: ${fileName}`;
    } else {
        this.nextElementSibling.textContent = 'Formatos permitidos: PDF, TXT, DOCX. Máximo 10 MB.';
    }
});

// Initial load
loadVehicles();
</script>
</body>
</html>
