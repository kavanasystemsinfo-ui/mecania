# Perfil de producción.
#
# Apaga el SQL y la depuración de Hibernate que el fichero base activa por
# defecto. En desarrollo ese volcado es útil; en producción es un filtrado de
# datos (emails, contenido de manuales) en los logs, además de ruido. Se activa
# en Render con la variable de entorno SPRING_PROFILES_ACTIVE=prod.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# Rate limiting de /api/** activo SÓLO en producción: token bucket por IP,
# más estricto en el login (10/min) que en el resto (120/min).
mecania.rate-limit.enabled=true
mecania.rate-limit.api-peticiones-por-minuto=120
mecania.rate-limit.auth-peticiones-por-minuto=10

# El resto se hereda del fichero base: la base de datos y los secretos vienen
# del entorno (DATABASE_URL / JWT_SECRET / MECANIA_S3_*), no de este archivo.
#
# NOTA sobre ddl-auto: se mantiene 'update' (lo que decide el fichero base)
# a propósito, hasta que existan migraciones versionadas (ticket B3). Forzar
# aquí 'validate' rompería un arranque de producción si el esquema y las
# entidades divergieran sin un historial al que volver.