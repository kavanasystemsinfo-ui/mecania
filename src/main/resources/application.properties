spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/mecania}
spring.datasource.username=${DB_USERNAME:mecania}
spring.datasource.password=${DB_PASSWORD:mecania}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Enable SQL logging for debugging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Subida de manuales. El límite del servidor de aplicaciones y el que valida el
# servicio tienen que coincidir: si Spring corta antes, el usuario recibe un 413
# aunque el fichero esté por debajo del límite anunciado.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=27MB
mecania.upload.max-bytes=26214400

# Almacenamiento de manuales:
#   local -> disco de la máquina (desarrollo; en un contenedor es efímero)
#   s3    -> servicio de objetos compatible con S3 (Cloudflare R2 en producción)
mecania.storage.tipo=${MECANIA_STORAGE_TIPO:local}
# Solo se usan con tipo=s3. El endpoint de R2 es
# https://<ACCOUNT_ID>.r2.cloudflarestorage.com y la región es "auto".
mecania.storage.s3.bucket=${MECANIA_S3_BUCKET:}
mecania.storage.s3.endpoint=${MECANIA_S3_ENDPOINT:}
mecania.storage.s3.region=${MECANIA_S3_REGION:auto}
mecania.storage.s3.access-key=${MECANIA_S3_ACCESS_KEY:}
mecania.storage.s3.secret-key=${MECANIA_S3_SECRET_KEY:}
mecania.storage.s3.path-style=${MECANIA_S3_PATH_STYLE:false}

# Autenticación JWT. El secreto es SOLO de desarrollo: en producción debe venir
# del entorno (variable JWT_SECRET), nunca de este archivo. Sin la variable, el
# arranque FALLA a propósito (ver JwtService): un despliegue sin secreto no debe
# quedarse abierto firmando tokens con un valor conocido del repositorio.
mecania.auth.enabled=true
mecania.jwt.secret=${JWT_SECRET:}
mecania.jwt.expiration-ms=86400000

# Rate limiting de /api/** (token bucket por IP). Base APAGADO: desarrollo y la
# suite de tests no deben tocar un límite global por IP. Se enciende solo con el
# perfil de producción (application-prod.properties).
mecania.rate-limit.enabled=false
mecania.rate-limit.api-peticiones-por-minuto=120
mecania.rate-limit.auth-peticiones-por-minuto=10