spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/mecania}
spring.datasource.username=${DB_USERNAME:mecania}
spring.datasource.password=${DB_PASSWORD:mecania}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Enable SQL logging for debugging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Autenticación JWT. El secreto es SOLO de desarrollo: en producción debe venir
# del entorno (variable MECANIA_JWT_SECRET), nunca de este archivo.
mecania.auth.enabled=true
mecania.jwt.secret=${JWT_SECRET:dev-only-secret-cambiar-en-produccion-0123456789abcdef0123456789abcdef}
mecania.jwt.expiration-ms=86400000