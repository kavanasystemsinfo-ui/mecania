spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/mecania}
spring.datasource.username=${DB_USERNAME:mecania}
spring.datasource.password=${DB_PASSWORD:mecania}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Enable SQL logging for debugging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Subida de manuales. El límite del servidor de aplicaciones y el que valida el
# servicio tienen que coincidir: si Spring corta antes, el usuario recibe un 413
# aunque el fichero esté por debajo del límite anunciado.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=27MB
mecania.upload.max-bytes=26214400

# Autenticación JWT. El secreto es SOLO de desarrollo: en producción debe venir
# del entorno (variable JWT_SECRET), nunca de este archivo. Sin la variable, el
# arranque FALLA a propósito (ver JwtService): un despliegue sin secreto no debe
# quedarse abierto firmando tokens con un valor conocido del repositorio.
mecania.auth.enabled=true
mecania.jwt.secret=${JWT_SECRET:}
mecania.jwt.expiration-ms=86400000